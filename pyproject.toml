[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "glyptic"
version = "0.0.1"
requires-python = "~=3.11"
readme = "README.md"
license = {file = "LICENSE"}
dependencies = [
  "pyxel>=2.1.6",
  "clearml>=1.16.3",
  "jax[cuda12]>=0.4.31",
  "jaxtyping>=0.2.33",
  "pillow>=10.4.0",
  "flax>=0.8.5",
]

[project.optional-dependencies]
tests = ["pytest>=8.3.2"]

[tool.setuptools.packages.find]
where = ["glyptic"]

[tool.ruff]
line-length=100




